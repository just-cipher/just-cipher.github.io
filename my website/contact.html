<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions — Emmanuel Chimmeremeze</title>
    
    <!-- 1. LINK TO YOUR GLOBAL STYLESHEET -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 2. UNIQUE PORTAL FAVICON ICON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230066cc%22/><text y=%22.9em%22 x=%2218%22 font-family=%22sans-serif%22 font-size=%2265%22 font-weight=%22bold%22 fill=%22%23ffffff%22>E</text><circle cx=%2272%22 cy=%2250%22 r=%2210%22 fill=%22%234da6ff%22/></svg>">
</head>
<body>

    <!-- 3. THE MASTER HOUSE CONTAINER FRAMEWORK -->
    <div class="app-layout">
        
        <!-- SIDEBAR PANEL (IDENTICAL ROOM COPIED TO KEEP APP LOCKED) -->
        <aside class="sidebar">
            <h1>Emmanuel Chimmeremeze</h1>
            <p class="tagline">CS Student @ UNN</p>
            
            <nav class="site-nav">
                <a href="index.html" id="nav-home">Home</a>
                <a href="blog.html" id="nav-blog">Blog</a>
                <a href="shelves.html" id="nav-shelves">Shelves</a>
                <a href="projects.html" id="nav-projects">Projects</a>
                <a href="about.html" id="nav-about">About Me</a>
                <a href="contact.html" id="nav-contact">Questions</a>
            </nav>

            <div class="utility-tray">
                <div class="tray-section">
                    <p class="tray-label">Interface</p>
                    <button id="theme-toggle" class="theme-btn">🌙</button>
                </div>
                <div class="tray-section">
                    <p class="tray-label">Text Accent Ink</p>
                    <div class="color-picker-grid">
                        <div class="color-dot" style="background: #222222;" data-color="#222222"></div>
                        <div class="color-dot" style="background: #0066cc;" data-color="#0066cc"></div>
                        <div class="color-dot" style="background: #00875a;" data-color="#00875a"></div>
                        <div class="color-dot" style="background: #e65c00;" data-color="#e65c00"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- RIGHT MAIN CONTENT: THE INTERACTIVE TEXT MATRIX QUESTIONS COMPONENT -->
        <main class="main-content">
            <section class="content-section">
                <h1>Ask a Question</h1>
                <p class="section-intro">Have a question about my CS journey at UNN, my startup case studies, or want to collaborate? Drop a message below and it'll fly straight to my inbox.</p>
                
                <!-- 4. AWARD-STYLE SECURE INTERACTIVE INPUT FORM -->
                <form action="https://formspree.io" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" name="name" id="name" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" name="email" id="email" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Your Question / Message</label>
                        <textarea name="message" id="message" rows="6" required placeholder="What's on your mind?"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message →</button>
                </form>
            </section>
        </main>

    </div>

    <!-- IDENTICAL SCRIPT COPIED TO STAY SYNCED -->
    <script>
        document.getElementById("nav-contact").classList.add("active");

        // Theme Toggle Engine
        const toggleButton = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleButton.innerHTML = currentTheme === 'dark' ? '☀️' : '🌙';

        toggleButton.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleButton.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // Color Customizer Engine
        const colorDots = document.querySelectorAll('.color-dot');
        const savedColor = localStorage.getItem('ink-color') || '#222222';
        document.documentElement.style.setProperty('--text-main', savedColor);
        colorDots.forEach(dot => {
            if(dot.getAttribute('data-color') === savedColor) dot.classList.add('active');
            dot.addEventListener('click', (e) => {
                colorDots.forEach(d => d.classList.remove('active'));
                const selectedColor = e.target.getAttribute('data-color');
                document.documentElement.style.setProperty('--text-main', selectedColor);
                localStorage.setItem('ink-color', selectedColor);
                e.target.classList.add('active');
            });
        });
    </script>
</body>
</html>
